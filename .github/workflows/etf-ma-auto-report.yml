name: ETF MA Auto Report

on:
  workflow_dispatch:
  schedule:
    # 11:00, 13:00, 14:30 KST, Monday-Friday.
    # GitHub cron uses UTC: 02:00, 04:00, 05:30.
    - cron: "0 2,4 * * 1-5"
    - cron: "30 5 * * 1-5"

permissions:
  contents: read

jobs:
  run-etf-ma-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Korean fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETF MA report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
          TELEGRAM_REQUIRED: "true"
          RESULTS_DIR: "results"
        run: python etf_ma_report.py

      - name: Upload ETF MA image artifact
        uses: actions/upload-artifact@v4
        with:
          name: etf-ma-buy-summary
          path: results/etf_ma_buy_summary_*
          if-no-files-found: warn
