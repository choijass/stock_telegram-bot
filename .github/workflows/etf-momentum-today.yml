name: ETF Momentum Today

on:
  workflow_dispatch:
  schedule:
    # 11:00, 13:00, 14:30 KST, Monday-Friday.
    # GitHub cron uses UTC: 02:00, 04:00, 05:30.
    - cron: "0 2,4 * * 1-5"
    - cron: "30 5 * * 1-5"

permissions:
  contents: read

jobs:
  run-etf-momentum-today:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETF momentum report
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          SEND_CHAT_ID: "@sang_red"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
          TELEGRAM_REQUIRED: "true"
        run: python etf_momentum_today.py

      - name: Upload ETF momentum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etf-momentum-today
          path: results/etf_momentum_today_*
          if-no-files-found: warn
