name: ETF Momentum Today

on:
  workflow_dispatch:
  schedule:
    # 12:00, 15:30 KST, Monday-Friday.
    # GitHub cron is UTC: 03:00, 06:30 UTC.
    - cron: "0 3 * * 1-5"
    - cron: "30 6 * * 1-5"

permissions:
  contents: read

jobs:
  run-etf-momentum-today:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETF momentum report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REQUIRED: "true"
        run: python etf_momentum_today.py

      - name: Upload ETF momentum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etf-momentum-today
          path: results/etf_momentum_today_*
          if-no-files-found: warn
