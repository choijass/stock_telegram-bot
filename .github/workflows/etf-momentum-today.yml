name: ETF Momentum Today

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-etf-momentum-today:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETF momentum report
        env:
          SEND_BOT_TOKEN: ${{ secrets.SEND_BOT_TOKEN }}
          SEND_CHAT_ID: ${{ secrets.SEND_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REQUIRED: "true"
        run: python etf_momentum_today.py

      - name: Upload ETF momentum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etf-momentum-today
          path: results/etf_momentum_today_*
          if-no-files-found: warn
