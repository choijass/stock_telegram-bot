name: KRX 14:00 + 15:30 Market Reports

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. KST = UTC+9.
    # 14:00 KST = 05:00 UTC / 15:30 KST = 06:30 UTC
    - cron: "0 5 * * 1-5"
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: krx-market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Run scheduled market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "0 5 * * 1-5" ]; then
            MODE=1400
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "30 6 * * 1-5" ]; then
            MODE=1530
          else
            NOW_HM=$(TZ=Asia/Seoul date +%H%M)
            if [ "$NOW_HM" -lt "1500" ]; then MODE=1400; else MODE=1530; fi
          fi
          echo "event=$EVENT_NAME schedule=$SCHEDULE_EXPR report_mode=$MODE kst=$(TZ=Asia/Seoul date '+%F %T')"
          REPORT_MODE=$MODE python krx_1430_report.py

      - name: Persist D+1 history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnover_2000_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update turnover history"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: krx-market-report
          path: results/krx_*.txt
          if-no-files-found: warn
