name: KRX 15:30 Closing Report
on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: krx-1530-closing-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run 15:30 closing report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
        run: python krx_1430_report.py
      - name: Persist D+1 history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnover_2000_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update 14:30 turnover history"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krx-1430-report
          path: results/krx_1430_*.txt
