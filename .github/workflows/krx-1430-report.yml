name: KRX 14:00 + 15:30 Market Reports

on:
  workflow_dispatch:
    inputs:
      report_mode:
        type: choice
        options: ['1400', '1530']
        required: true
      report_date:
        description: 'KST date YYYY-MM-DD (blank = today)'
        type: string
        required: false
  schedule:
    # GitHub cron is UTC. KST = UTC+9.
    # 14:00 KST = 05:00 UTC / 15:30 KST = 06:30 UTC
    - cron: "0 5 * * 1-5"
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: krx-market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install requests pandas beautifulsoup4

      - name: Run scheduled market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          REPORT_MODE: ${{ inputs.report_mode }}
          REPORT_DATE: ${{ inputs.report_date }}
        run: python scripts/krx_delivery.py

      - name: Persist D+1 history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnover_2000_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update turnover history"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: krx-market-report
          path: results/
          if-no-files-found: warn
