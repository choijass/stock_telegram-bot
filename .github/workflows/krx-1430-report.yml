name: KRX 14:00 + 15:30 Market Reports
on:
  workflow_dispatch:
  schedule:
    # 14:00 KST = 05:00 UTC; 15:30 KST = 06:30 UTC
    - cron: "0 5 * * 1-5"
    - cron: "30 6 * * 1-5"
permissions:
  contents: write
concurrency:
  group: krx-1530-closing-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run scheduled market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
        run: |
          HOUR=$(TZ=Asia/Seoul date +%H%M)
          if [ "$HOUR" -lt "1500" ]; then
            REPORT_MODE=1400 python krx_1430_report.py
          else
            REPORT_MODE=1530 python krx_1430_report.py
          fi
      - name: Persist D+1 history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnover_2000_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update 14:30 turnover history"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krx-1430-report
          path: results/krx_1430_*.txt
