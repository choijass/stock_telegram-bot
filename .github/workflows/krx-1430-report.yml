name: KRX 14:00 + 15:30 Market Reports
on:
  workflow_dispatch:
  schedule:
    # Start 5 minutes early to avoid GitHub's top-of-hour schedule congestion,
    # then wait until the exact KST report time inside the job.
    - cron: "55 13 * * 1-5"
      timezone: "Asia/Seoul"
    - cron: "25 15 * * 1-5"
      timezone: "Asia/Seoul"
permissions:
  contents: write
concurrency:
  group: krx-1530-closing-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run scheduled market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "@sang_red"
        env:
          SCHEDULE_EXPR: ${{ github.event.schedule }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "55 13 * * 1-5" ]; then
            MODE=1400
            TARGET=1400
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_EXPR" = "25 15 * * 1-5" ]; then
            MODE=1530
            TARGET=1530
          else
            # Manual Run workflow: choose the nearest logical report mode by KST.
            NOW_HM=$(TZ=Asia/Seoul date +%H%M)
            if [ "$NOW_HM" -lt "1500" ]; then MODE=1400; TARGET=0000; else MODE=1530; TARGET=0000; fi
          fi
          if [ "$TARGET" != "0000" ]; then
            python - <<'PY'
          import os,time
          from datetime import datetime,timedelta,timezone
          kst=timezone(timedelta(hours=9))
          now=datetime.now(kst)
          target_h,target_m=(14,0) if os.environ["SCHEDULE_EXPR"].startswith("55 13") else (15,30)
          target=now.replace(hour=target_h,minute=target_m,second=0,microsecond=0)
          sec=(target-now).total_seconds()
          if sec>0: time.sleep(sec)
          PY
          fi
          REPORT_MODE=$MODE python krx_1430_report.py
      - name: Persist D+1 history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/turnover_2000_history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update 14:30 turnover history"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: krx-market-report
          path: results/krx_*.txt
