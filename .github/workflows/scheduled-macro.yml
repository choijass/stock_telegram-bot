name: Scheduled Macro

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 10:00, 12:00, 14:00, 15:00 KST, Monday-Friday.
    # GitHub cron is UTC, so this is 01:00, 03:00, 05:00, 06:00 UTC.
    - cron: "0 1,3,5,6 * * 1-5"

permissions:
  contents: read

jobs:
  run-macro:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run macro
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REQUIRED: "true"
          USE_GOOGLE_SHEETS: "true"
          RESULTS_DIR: "results"
        run: python macro.py

      - name: Upload SIGNAL CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: signal-result
          path: results/signal_*.csv
          if-no-files-found: warn
