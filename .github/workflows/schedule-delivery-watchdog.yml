name: Schedule Delivery Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 5,6,7 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: schedule-delivery-watchdog
  cancel-in-progress: false

jobs:
  verify-and-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify scheduled reports and retry missing runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/schedule_watchdog.py
