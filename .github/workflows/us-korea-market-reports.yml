name: US Korea Market Reports

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 07:00 KST. Runs Tue-Sat KST after regular US market days.
    - cron: "0 22 * * 1-5"

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_PARSE_MODE: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pandas_market_calendars

      - name: Check NYSE trading day
        id: market
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          import pandas_market_calendars as mcal

          ny_date = datetime.now(ZoneInfo("America/New_York")).date()
          nyse = mcal.get_calendar("NYSE")
          schedule = nyse.schedule(start_date=str(ny_date), end_date=str(ny_date))
          should_send = "true" if not schedule.empty else "false"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_send={should_send}\n")
              output.write(f"ny_date={ny_date}\n")

          print(f"NYSE date: {ny_date}, should_send={should_send}")
          PY

      - name: Generate latest reports
        if: github.event_name == 'workflow_dispatch' || steps.market.outputs.should_send == 'true'
        run: python scripts/generate_us_korea_market_reports.py

      - name: Send US market report
        if: github.event_name == 'workflow_dispatch' || steps.market.outputs.should_send == 'true'
        env:
          MESSAGE_PATH: reports/us_market_report_1.txt
        run: python scripts/send_manual_telegram_message.py

      - name: Send Korea impact report
        if: github.event_name == 'workflow_dispatch' || steps.market.outputs.should_send == 'true'
        env:
          MESSAGE_PATH: reports/korea_impact_report_2.txt
        run: python scripts/send_manual_telegram_message.py
